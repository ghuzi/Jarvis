<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI Assistant</title>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --accent-color: #534AB7;
            --accent-hover: #6a5fd1;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --panel-bg: #15151e;
            --user-msg: #534AB7;
            --ai-msg: #21212d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: url('Portofolio.jpeg');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }

        /* Header */
        header {
            padding: 1.5rem;
            background-color: var(--panel-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .api-key-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }



        #api-key {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(83, 74, 183, 0.3);
            color: var(--text-main);
            padding: 0.6rem 1.25rem;
            border-radius: 25px;
            width: 100%;
            max-width: 450px;
            outline: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            text-align: center;
            letter-spacing: 0.5px;
        }

        #api-key:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(83, 74, 183, 0.2);
        }

        .sidebar-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            z-index: 50;
            transition: color 0.3s ease;
        }

        .sidebar-toggle:hover {
            color: var(--accent-color);
        }

        .sidebar {
            position: absolute;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 40;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            padding-top: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1rem;
            font-weight: 600;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .clear-history-btn {
            margin: 15px;
            padding: 10px;
            background-color: rgba(229, 62, 62, 0.1);
            border: 1px solid rgba(229, 62, 62, 0.3);
            color: #fc8181;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clear-history-btn:hover {
            background-color: rgba(229, 62, 62, 0.2);
        }

        /* Chat Area */
        main {
            flex: 1;
            overflow-y: auto;
            height: calc(100vh - 200px);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: popIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.ai {
            align-self: flex-start;
        }

        .bubble {
            padding: 1rem 1.25rem;
            border-radius: 20px;
            line-height: 1.5;
            position: relative;
            font-size: 1rem;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
        }

        .message.user .bubble {
            background: linear-gradient(135deg, var(--accent-color), #403698);
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background-color: var(--ai-msg);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .actions {
            display: flex;
            justify-content: flex-start;
            gap: 0.5rem;
            margin-top: 0.5rem;
            margin-left: 0.5rem;
        }

        .action-btn {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Typing Indicator */
        .typing-indicator {
            align-self: flex-start;
            background-color: var(--ai-msg);
            padding: 1rem 1.25rem;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            display: none;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .typing-indicator.visible {
            display: flex;
            animation: popIn 0.3s ease-out forwards;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Footer */
        footer {
            padding: 1.5rem;
            background-color: var(--panel-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .mic-btn {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .mic-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .mic-btn.recording {
            background-color: #e53e3e;
            border-color: #e53e3e;
            color: white;
            animation: pulseRed 1.5s infinite;
        }

        @keyframes pulseRed {
            0% {
                box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.7);
            }

            70% {
                box-shadow: 0 0 0 12px rgba(229, 62, 62, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(229, 62, 62, 0);
            }
        }

        #text-input {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.85rem 1.25rem;
            border-radius: 25px;
            outline: none;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        #text-input:focus {
            border-color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.5);
        }

        .send-btn {
            background-color: var(--accent-color);
            border: none;
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(83, 74, 183, 0.3);
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(83, 74, 183, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            background-color: rgba(83, 74, 183, 0.5);
            cursor: not-allowed;
            color: rgba(255, 255, 255, 0.5);
            transform: none;
            box-shadow: none;
        }



        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div id="app">
        <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle History">☰</button>
        <div id="sidebar" class="sidebar">
            <div class="sidebar-header">Chat History</div>
            <div id="history-list" class="history-list">
                <!-- History items will appear here -->
            </div>
            <button id="clear-history-btn" class="clear-history-btn">Clear History</button>
        </div>

        <main id="chat-container">
            <div class="message ai">
                <div class="bubble">Hello, I am Jarvis. How can I assist you today?</div>
                <div class="actions">
                    <button class="action-btn" title="Speak message"
                        onclick="handleSpeakToggle('Hello, I am Jarvis. How can I assist you today?', this)">🔊</button>
                    <button class="action-btn" title="Copy message"
                        onclick="navigator.clipboard.writeText('Hello, I am Jarvis. How can I assist you today?')">Copy</button>
                    <button class="action-btn" title="Edit message"
                        onclick="document.getElementById('text-input').value = 'Hello, I am Jarvis. How can I assist you today?'">Edit</button>
                </div>
            </div>
            <div id="typing-indicator" class="typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </main>


        <footer>
            <div class="input-container">
                <button id="mic-btn" class="mic-btn" title="Click to speak">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <input type="text" id="text-input" placeholder="Type or speak a message..." autocomplete="off">
                <button id="send-btn" class="send-btn">Send</button>
            </div>
        </footer>
    </div>

    <script>
        document.body.style.overflowY = 'hidden';

        // State
        let memories = [];
        let conversationHistory = [];
        let isRecording = false;
        let currentSpeakBtn = null;

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const typingIndicator = document.getElementById('typing-indicator');
        const micBtn = document.getElementById('mic-btn');
        const textInput = document.getElementById('text-input');
        const sendBtn = document.getElementById('send-btn');

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                textInput.placeholder = 'Listening...';
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (finalTranscript) {
                    textInput.value = finalTranscript;
                } else if (interimTranscript) {
                    textInput.value = interimTranscript;
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                stopRecording();
            };

            recognition.onend = () => {
                if (isRecording) {
                    stopRecording();
                    if (textInput.value.trim() !== '') {
                        handleSend();
                    }
                }
            };
        } else {
            micBtn.style.display = 'none';
            console.warn("Speech Recognition API not supported in this browser.");
        }

        const toggleRecording = () => {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                textInput.value = '';
                recognition.start();
            }
        };

        const stopRecording = () => {
            isRecording = false;
            micBtn.classList.remove('recording');
            textInput.placeholder = 'Type or speak a message...';
        };

        micBtn.addEventListener('click', toggleRecording);

        // Speech Synthesis Setup
        const handleSpeakToggle = (text, btn) => {
            if (btn === currentSpeakBtn && window.speechSynthesis && window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                btn.textContent = '🔊';
                currentSpeakBtn = null;
                return;
            }
            speakText(text, btn);
        };

        const speakText = (text, btn = null) => {
            if (!window.speechSynthesis) return;

            window.speechSynthesis.cancel();
            if (currentSpeakBtn) {
                currentSpeakBtn.textContent = '🔊';
            }

            let speechText = text
                .replace(/MEMORY_UPDATE[=:]\s*[\"\{].*$/gms, '')
                .replace(/\{[^}]*\}/gs, '')
                .replace(/\[[^\]]*\]/gs, '')
                .trim();

            const utterance = new SpeechSynthesisUtterance(speechText);

            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.name.includes('Google UK English Male') || v.name.includes('Daniel') || v.name.includes('Male')) || voices.find(v => v.lang.startsWith('en'));
            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.rate = 1.05;
            utterance.pitch = 0.95;

            if (btn) {
                currentSpeakBtn = btn;
                btn.textContent = '⏹';
                utterance.onend = () => {
                    if (currentSpeakBtn === btn) {
                        btn.textContent = '🔊';
                        currentSpeakBtn = null;
                    }
                };
                utterance.onerror = () => {
                    if (currentSpeakBtn === btn) {
                        btn.textContent = '🔊';
                        currentSpeakBtn = null;
                    }
                };
            }

            window.speechSynthesis.speak(utterance);
        };

        // Initialize voices
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Chat UI
        const addMessage = (text, sender) => {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const msgId = 'msg-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            messageDiv.id = msgId;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            // Clean text for display
            bubbleDiv.textContent = text
                .replace(/MEMORY_UPDATE[=:]\s*[\"\{].*$/gms, '')
                .replace(/\{[^}]*\}/gs, '')
                .replace(/\[[^\]]*\]/gs, '')
                .trim();

            messageDiv.appendChild(bubbleDiv);

            let speakBtnRef = null;
            if (sender === 'ai') {
                const actionsDiv = document.createElement('div');
                actionsDiv.className = 'actions';

                const speakBtn = document.createElement('button');
                speakBtn.className = 'action-btn';
                speakBtn.title = 'Speak message';
                speakBtn.textContent = '🔊';
                speakBtn.onclick = () => handleSpeakToggle(bubbleDiv.textContent, speakBtn);
                speakBtnRef = speakBtn;

                const copyBtn = document.createElement('button');
                copyBtn.className = 'action-btn';
                copyBtn.title = 'Copy message';
                copyBtn.textContent = 'Copy';
                copyBtn.onclick = () => navigator.clipboard.writeText(bubbleDiv.textContent);

                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn';
                editBtn.title = 'Edit message';
                editBtn.textContent = 'Edit';
                editBtn.onclick = () => document.getElementById('text-input').value = bubbleDiv.textContent;

                actionsDiv.appendChild(speakBtn);
                actionsDiv.appendChild(copyBtn);
                actionsDiv.appendChild(editBtn);
                messageDiv.appendChild(actionsDiv);
            }

            chatContainer.insertBefore(messageDiv, typingIndicator);
            scrollToBottom();
            return { speakBtnRef, msgId };
        };

        const scrollToBottom = () => {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        const setTyping = (isTyping) => {
            if (isTyping) {
                typingIndicator.classList.add('visible');
                sendBtn.disabled = true;
                scrollToBottom();
            } else {
                typingIndicator.classList.remove('visible');
                sendBtn.disabled = false;
            }
        };

        // Sidebar Logic
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const historyList = document.getElementById('history-list');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        clearHistoryBtn.addEventListener('click', () => {
            historyList.innerHTML = '';
            const messages = chatContainer.querySelectorAll('.message');
            for (let i = 1; i < messages.length; i++) {
                messages[i].remove();
            }
            conversationHistory = [];
        });

        const updateMemories = (newMemories) => {
            memories = newMemories;
            // Memory chips UI removed per request, but logic remains
        };

        // API Interaction
        const callGroqApi = async () => {
            setTyping(true);

            try {
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: conversationHistory
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'Failed to fetch response');
                }

                const data = await response.json();
                const aiMessage = data.choices[0].message.content;

                // Add to history
                conversationHistory.push({ role: "assistant", content: aiMessage });

                // Parse Memory
                const memoryMatch = aiMessage.match(/MEMORY_UPDATE:\s*(\{.*\})/s);
                if (memoryMatch && memoryMatch[1]) {
                    try {
                        const memoryData = JSON.parse(memoryMatch[1]);

                        // Extract array dynamically based on the structure returned
                        let memArray = [];
                        if (Array.isArray(memoryData)) {
                            memArray = memoryData;
                        } else {
                            for (const key in memoryData) {
                                if (Array.isArray(memoryData[key])) {
                                    memArray = memoryData[key];
                                    break;
                                }
                            }
                        }

                        if (memArray.length > 0) {
                            // Merge new memories, ensuring uniqueness
                            const mergedMemories = [...new Set([...memories, ...memArray])];
                            updateMemories(mergedMemories);
                        }
                    } catch (e) {
                        console.error("Failed to parse memory json", e);
                    }
                }

                // UI Updates
                setTyping(false);
                const cleanReply = aiMessage
                    .replace(/MEMORY_UPDATE[=:]\s*[\"\{].*$/gms, '')
                    .replace(/\{[^}]*\}/gs, '')
                    .replace(/\[[^\]]*\]/gs, '')
                    .trim();
                const { speakBtnRef: newSpeakBtn } = addMessage(cleanReply, 'ai');
                speakText(cleanReply, newSpeakBtn);

            } catch (error) {
                console.error(error);
                setTyping(false);
                addMessage(`Error: ${error.message}.`, 'ai');
            }
        };

        const handleSend = () => {
            const text = textInput.value.trim();
            if (!text) return;

            // Add user message
            const { msgId: userMsgId } = addMessage(text, 'user');
            conversationHistory.push({ role: "user", content: text });
            textInput.value = '';

            // Add to sidebar
            const historyItem = document.createElement('div');
            historyItem.className = 'history-item';
            historyItem.textContent = text.length > 30 ? text.substring(0, 30) + '...' : text;
            historyItem.onclick = () => {
                const targetMsg = document.getElementById(userMsgId);
                if (targetMsg) targetMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            historyList.appendChild(historyItem);

            // System Commands
            const lowerText = text.toLowerCase();
            if (lowerText.includes('open file manager')) {
                fetch('http://localhost:8765/command?action=filemanager');
                const reply = 'Opening File Manager for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('open browser')) {
                window.open('https://google.com', '_blank');
                const reply = 'Opening Browser for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('open terminal')) {
                fetch('http://localhost:8765/command?action=terminal');
                const reply = 'Opening terminal for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('open youtube')) {
                fetch('http://localhost:8765/command?action=youtube');
                const reply = 'Opening YouTube for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('open google')) {
                window.open('https://google.com', '_blank');
                const reply = 'Opening Google for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('play music')) {
                window.open('https://spotify.com', '_blank');
                const reply = 'Playing music on Spotify for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
