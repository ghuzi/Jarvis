<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis AI Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0a0a0f;
            --accent-color: #534AB7;
            --accent-hover: #6a5fd1;
            --text-main: #ffffff;
            --text-muted: #a0a0b0;
            --panel-bg: #15151e;
            --user-msg: #534AB7;
            --ai-msg: #21212d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            background-image: url('Portofolio.jpeg');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 0;
        }

        #app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            flex: 1;
            height: 100%;
        }

        /* Header */
        header {
            padding: 1.5rem;
            background-color: var(--panel-bg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .api-key-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
        }



        #api-key {
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(83, 74, 183, 0.3);
            color: var(--text-main);
            padding: 0.6rem 1.25rem;
            border-radius: 25px;
            width: 100%;
            max-width: 450px;
            outline: none;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            text-align: center;
            letter-spacing: 0.5px;
        }

        #api-key:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(83, 74, 183, 0.2);
        }

        .top-navbar {
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            padding: 0 20px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 70;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .sidebar-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            cursor: pointer;
            z-index: 50;
            transition: color 0.3s ease;
        }

        .sidebar-close:hover {
            color: var(--accent-color);
        }

        .navbar-title {
            color: #534AB7;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 2px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .sidebar-toggle {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .sidebar-toggle:hover {
            color: var(--accent-color);
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -260px;
            width: 260px;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 60;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #534AB7;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar.open ~ main {
            margin-left: 260px;
        }

        .sidebar-header {
            padding: 20px;
            padding-top: 60px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 1rem;
            font-weight: 600;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item:hover,
        .session-item:hover {
            background: var(--accent-color);
            color: var(--text-main);
        }

        .session-item {
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .session-item.active,
        .history-item.active {
            background: var(--accent-color);
            color: var(--text-main);
        }

        .clear-history-btn {
            margin: 15px;
            padding: 10px;
            background-color: rgba(229, 62, 62, 0.1);
            border: 1px solid rgba(229, 62, 62, 0.3);
            color: #fc8181;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clear-history-btn:hover {
            background-color: rgba(229, 62, 62, 0.2);
        }

        .new-chat-btn {
            margin: 15px;
            margin-bottom: 5px;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent-color), #403698);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .new-chat-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(83, 74, 183, 0.4);
        }

        /* Chat Area */
        main {
            flex: 1;
            overflow-y: auto;
            height: calc(100vh - 200px);
            padding: 2rem;
            padding-top: 60px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            scroll-behavior: smooth;
            margin-left: 0;
            transition: margin-left 0.3s ease;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: popIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes popIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
        }

        .message.ai {
            align-self: flex-start;
        }

        .bubble {
            padding: 1rem 1.25rem;
            border-radius: 20px;
            line-height: 1.5;
            position: relative;
            font-size: 1rem;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
        }

        .message.user .bubble {
            background: linear-gradient(135deg, var(--accent-color), #403698);
            border-bottom-right-radius: 4px;
        }

        .message.ai .bubble {
            background-color: var(--ai-msg);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .actions {
            display: flex;
            justify-content: flex-start;
            gap: 0.5rem;
            margin-top: 0.5rem;
            margin-left: 0.5rem;
        }

        .action-btn {
            background-color: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.3rem 0.8rem;
            border-radius: 12px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            color: var(--text-main);
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Typing Indicator */
        .typing-indicator {
            align-self: flex-start;
            background-color: var(--ai-msg);
            padding: 1rem 1.25rem;
            border-radius: 20px;
            border-bottom-left-radius: 4px;
            display: none;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .typing-indicator.visible {
            display: flex;
            animation: popIn 0.3s ease-out forwards;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Footer */
        footer {
            padding: 1.5rem;
            background-color: var(--panel-bg);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.3);
        }

        .input-container {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .mic-btn {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .mic-btn:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .mic-btn.recording {
            background-color: #e53e3e;
            border-color: #e53e3e;
            color: white;
            animation: pulseRed 1.5s infinite;
        }

        @keyframes pulseRed {
            0% {
                box-shadow: 0 0 0 0 rgba(229, 62, 62, 0.7);
            }

            70% {
                box-shadow: 0 0 0 12px rgba(229, 62, 62, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(229, 62, 62, 0);
            }
        }

        #text-input {
            flex: 1;
            background-color: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 0.85rem 1.25rem;
            border-radius: 25px;
            outline: none;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        #text-input:focus {
            border-color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.5);
        }

        .send-btn {
            background-color: var(--accent-color);
            border: none;
            color: white;
            padding: 0.85rem 1.5rem;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(83, 74, 183, 0.3);
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(83, 74, 183, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            background-color: rgba(83, 74, 183, 0.5);
            cursor: not-allowed;
            color: rgba(255, 255, 255, 0.5);
            transform: none;
            box-shadow: none;
        }



        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="top-navbar">
            <button id="sidebar-toggle" class="sidebar-toggle" title="Toggle History">☰</button>
            <div class="navbar-title">JARVIS</div>
        </div>
        <div id="sidebar" class="sidebar">
            <button id="sidebar-close" class="sidebar-close" title="Close History">✕</button>
            <div class="sidebar-header">Chat History</div>
            <button id="new-chat-btn" class="new-chat-btn">+ New Chat</button>
            <div id="history-list" class="history-list">
                <!-- Session items will appear here -->
            </div>
            <button id="clear-history-btn" class="clear-history-btn">Clear All History</button>
        </div>

        <main id="chat-container">
            <div class="message ai">
                <div class="bubble">Hello, I am Jarvis. How can I assist you today?</div>
                <div class="actions">
                    <button class="action-btn" title="Speak message"
                        onclick="handleSpeakToggle('Hello, I am Jarvis. How can I assist you today?', this)">🔊</button>
                    <button class="action-btn" title="Copy message"
                        onclick="navigator.clipboard.writeText('Hello, I am Jarvis. How can I assist you today?')">Copy</button>
                </div>
            </div>
            <div id="typing-indicator" class="typing-indicator">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </main>


        <footer>
            <div class="input-container">
                <button id="mic-btn" class="mic-btn" title="Click to speak">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <input type="text" id="text-input" placeholder="Type or speak a message..." autocomplete="off">
                <button id="send-btn" class="send-btn">Send</button>
            </div>
        </footer>
    </div>

    <script>
        document.body.style.overflowY = 'hidden';

        // Supabase Setup
        const SUPABASE_URL = 'https://ecljkvpceakvsfscjqmq.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjbGprdnBjZWFrdnNmc2NqcW1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3Nzc1ODEsImV4cCI6MjA5MzM1MzU4MX0.b1G_1ZGA0ePg6-vr-BHkuMPNH1vCwl4SV3WKK_E1CqQ';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const USER_ID = 'default_user';

        // UUID Generator
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                const r = Math.random() * 16 | 0;
                return (c == 'x' ? r : (r & 0x3 | 0x8)).toString(16);
            });
        }

        // State
        let memories = [];
        let conversationHistory = [];
        let isRecording = false;
        let currentSpeakBtn = null;
        let currentSessionId = localStorage.getItem('jarvis_last_session') || generateUUID();
        localStorage.setItem('jarvis_last_session', currentSessionId);

        // --- Supabase DB Functions ---
        async function saveMemoryToDB(memoryItem) {
            await supabaseClient.from('memories').insert({
                user_id: USER_ID,
                type: memoryItem.type,
                label: memoryItem.label,
                detail: memoryItem.detail
            });
        }

        async function loadMemoriesFromDB() {
            const { data } = await supabaseClient.from('memories')
                .select('*')
                .eq('user_id', USER_ID)
                .order('created_at', { ascending: true });
            if (data) memories = data;
        }

        async function saveChatToDB(role, content) {
            await supabaseClient.from('conversations').insert({
                user_id: USER_ID,
                session_id: currentSessionId,
                role: role,
                content: content
            });
        }

        async function loadChatFromDB(sessionId) {
            const sid = sessionId || currentSessionId;
            const { data } = await supabaseClient.from('conversations')
                .select('*')
                .eq('user_id', USER_ID)
                .eq('session_id', sid)
                .order('created_at', { ascending: true });
            if (data && data.length > 0) {
                data.forEach(msg => {
                    conversationHistory.push({ role: msg.role, content: msg.content });
                    addMessage(msg.content, msg.role === 'user' ? 'user' : 'ai');
                });
            }
        }

        // --- Session Management ---
        function getSessions() {
            const raw = localStorage.getItem('jarvis_sessions');
            return raw ? JSON.parse(raw) : [];
        }

        function saveSessions(sessions) {
            localStorage.setItem('jarvis_sessions', JSON.stringify(sessions));
        }

        function addSession(id, title) {
            const sessions = getSessions();
            // Don't duplicate
            if (sessions.find(s => s.id === id)) return;
            sessions.unshift({ id, title, created_at: new Date().toISOString() });
            saveSessions(sessions);
        }

        function updateSessionTitle(id, title) {
            const sessions = getSessions();
            const session = sessions.find(s => s.id === id);
            if (session && session.title === 'New Chat') {
                session.title = title.length > 30 ? title.substring(0, 30) + '...' : title;
                saveSessions(sessions);
            }
        }

        // DOM Elements
        const chatContainer = document.getElementById('chat-container');
        const typingIndicator = document.getElementById('typing-indicator');
        const micBtn = document.getElementById('mic-btn');
        const textInput = document.getElementById('text-input');
        const sendBtn = document.getElementById('send-btn');

        function clearChatUI() {
            // Remove all messages except the first welcome message
            const messages = chatContainer.querySelectorAll('.message');
            for (let i = 1; i < messages.length; i++) {
                messages[i].remove();
            }
            conversationHistory = [];
        }

        async function loadSession(sessionId) {
            currentSessionId = sessionId;

            // Clear current UI
            clearChatUI();

            // Load messages from Supabase for this session
            const { data, error } = await supabaseClient
                .from('conversations')
                .select('*')
                .eq('session_id', sessionId)
                .order('created_at', { ascending: true });

            if (data && data.length > 0) {
                data.forEach(msg => {
                    conversationHistory.push({
                        role: msg.role,
                        content: msg.content
                    });
                    addMessage(msg.content, msg.role === 'user' ? 'user' : 'ai');
                });
            }

            // Highlight active session in sidebar
            document.querySelectorAll('.session-item').forEach(el => {
                el.classList.remove('active');
            });
            const activeEl = document.querySelector(`[data-session-id="${sessionId}"]`);
            if (activeEl) activeEl.classList.add('active');

            // Save as current session
            localStorage.setItem('jarvis_last_session', sessionId);
        }

        function renderSessionsSidebar() {
            const historyList = document.getElementById('history-list');
            historyList.innerHTML = '';
            const sessions = getSessions();
            sessions.forEach(session => {
                const item = document.createElement('div');
                item.className = 'session-item' + (session.id === currentSessionId ? ' active' : '');
                item.setAttribute('data-session-id', session.id);
                item.textContent = session.title;
                item.onclick = () => loadSession(session.id);
                historyList.appendChild(item);
            });
        }

        // Speech Recognition Setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = null;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                isRecording = true;
                micBtn.classList.add('recording');
                textInput.placeholder = 'Listening...';
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                let finalTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }

                if (finalTranscript) {
                    textInput.value = finalTranscript;
                } else if (interimTranscript) {
                    textInput.value = interimTranscript;
                }
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error', event.error);
                stopRecording();
            };

            recognition.onend = () => {
                if (isRecording) {
                    stopRecording();
                    if (textInput.value.trim() !== '') {
                        handleSend();
                    }
                }
            };
        } else {
            micBtn.style.display = 'none';
            console.warn("Speech Recognition API not supported in this browser.");
        }

        const toggleRecording = () => {
            if (!recognition) return;
            if (isRecording) {
                recognition.stop();
            } else {
                textInput.value = '';
                recognition.start();
            }
        };

        const stopRecording = () => {
            isRecording = false;
            micBtn.classList.remove('recording');
            textInput.placeholder = 'Type or speak a message...';
        };

        micBtn.addEventListener('click', toggleRecording);

        // Speech Synthesis Setup
        const handleSpeakToggle = (text, btn) => {
            if (btn === currentSpeakBtn && window.speechSynthesis && window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                btn.textContent = '🔊';
                currentSpeakBtn = null;
                return;
            }
            speakText(text, btn);
        };

        const speakText = (text, btn = null) => {
            if (!window.speechSynthesis) return;

            window.speechSynthesis.cancel();
            if (currentSpeakBtn) {
                currentSpeakBtn.textContent = '🔊';
            }

            let speechText = text
                .replace(/MEMORY_UPDATE:\s*\{[^}]*\}/gs, '')
                .trim();

            const utterance = new SpeechSynthesisUtterance(speechText);

            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.name.includes('Google UK English Male') || v.name.includes('Daniel') || v.name.includes('Male')) || voices.find(v => v.lang.startsWith('en'));
            if (preferredVoice) utterance.voice = preferredVoice;

            utterance.rate = 1.05;
            utterance.pitch = 0.95;

            if (btn) {
                currentSpeakBtn = btn;
                btn.textContent = '⏹';
                utterance.onend = () => {
                    if (currentSpeakBtn === btn) {
                        btn.textContent = '🔊';
                        currentSpeakBtn = null;
                    }
                };
                utterance.onerror = () => {
                    if (currentSpeakBtn === btn) {
                        btn.textContent = '🔊';
                        currentSpeakBtn = null;
                    }
                };
            }

            window.speechSynthesis.speak(utterance);
        };

        // Initialize voices
        if (window.speechSynthesis) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Chat UI
        const addMessage = (text, sender) => {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;
            const msgId = 'msg-' + Date.now() + '-' + Math.floor(Math.random() * 1000);
            messageDiv.id = msgId;

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            // Clean text for display (remove MEMORY_UPDATE line only)
            bubbleDiv.textContent = text
                .replace(/MEMORY_UPDATE:\s*\{[^}]*\}/gs, '')
                .trim();

            messageDiv.appendChild(bubbleDiv);

            let speakBtnRef = null;
            const actionsDiv = document.createElement('div');
            actionsDiv.className = 'actions';

            if (sender === 'user') {
                actionsDiv.style.justifyContent = 'flex-end';
                actionsDiv.style.marginRight = '0.5rem';
                actionsDiv.style.marginLeft = '0';
            }

            if (sender === 'ai') {
                const speakBtn = document.createElement('button');
                speakBtn.className = 'action-btn';
                speakBtn.title = 'Speak message';
                speakBtn.textContent = '🔊';
                speakBtn.onclick = () => handleSpeakToggle(bubbleDiv.textContent, speakBtn);
                speakBtnRef = speakBtn;
                actionsDiv.appendChild(speakBtn);
            }

            const copyBtn = document.createElement('button');
            copyBtn.className = 'action-btn';
            copyBtn.title = 'Copy message';
            copyBtn.textContent = 'Copy';
            copyBtn.onclick = () => navigator.clipboard.writeText(bubbleDiv.textContent);
            actionsDiv.appendChild(copyBtn);

            if (sender === 'user') {
                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn';
                editBtn.title = 'Edit message';
                editBtn.textContent = 'Edit';
                editBtn.onclick = () => document.getElementById('text-input').value = bubbleDiv.textContent;
                actionsDiv.appendChild(editBtn);
            }

            messageDiv.appendChild(actionsDiv);

            chatContainer.insertBefore(messageDiv, typingIndicator);
            scrollToBottom();
            return { speakBtnRef, msgId };
        };

        const scrollToBottom = () => {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        };

        const setTyping = (isTyping) => {
            if (isTyping) {
                typingIndicator.classList.add('visible');
                sendBtn.disabled = true;
                scrollToBottom();
            } else {
                typingIndicator.classList.remove('visible');
                sendBtn.disabled = false;
            }
        };

        // Sidebar Logic
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarClose = document.getElementById('sidebar-close');
        const clearHistoryBtn = document.getElementById('clear-history-btn');
        const newChatBtn = document.getElementById('new-chat-btn');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('open');
        });

        sidebarClose.addEventListener('click', () => {
            sidebar.classList.remove('open');
        });

        document.addEventListener('click', function(e) {
            if (!sidebar.contains(e.target) && !sidebarToggle.contains(e.target)) {
                sidebar.classList.remove('open');
            }
        });

        // New Chat button
        newChatBtn.addEventListener('click', () => {
            currentSessionId = generateUUID();
            localStorage.setItem('jarvis_last_session', currentSessionId);
            addSession(currentSessionId, 'New Chat');
            clearChatUI();
            renderSessionsSidebar();
        });

        // Clear ALL history
        clearHistoryBtn.addEventListener('click', async () => {
            clearChatUI();
            // Clear from Supabase
            await supabaseClient.from('memories').delete().eq('user_id', USER_ID);
            await supabaseClient.from('conversations').delete().eq('user_id', USER_ID);
            memories = [];
            conversationHistory = [];
            // Clear all sessions from localStorage
            localStorage.removeItem('jarvis_sessions');
            // Start a fresh session
            currentSessionId = generateUUID();
            localStorage.setItem('jarvis_last_session', currentSessionId);
            addSession(currentSessionId, 'New Chat');
            renderSessionsSidebar();
        });

        const updateMemories = (newMemory) => {
            // newMemory is a {type, label, detail} object
            memories.push(newMemory);
            saveMemoryToDB(newMemory);
            console.log('Memory stored:', newMemory);
        };

        // Build system prompt with memory bank
        const buildSystemPrompt = () => {
            let memoryBank = '';
            if (memories.length === 0) {
                memoryBank = '(empty)';
            } else {
                memoryBank = memories.map(m => `- [${m.type}] ${m.label}: ${m.detail}`).join('\n');
            }

            return `You are Jarvis, a personal AI assistant with memory.

MEMORY BANK (already stored):
${memoryBank}

RULES:
1. When user mentions any event, exam, meeting, task, deadline, reminder — extract it and add at END of response:
   MEMORY_UPDATE:{"type":"event","label":"short label","detail":"full detail"}

2. When user asks about schedule, tasks, reminders, what to do — FIRST check MEMORY BANK above and list everything stored there. Do NOT give generic advice. Give SPECIFIC recall from memory.

3. Be conversational and helpful.
4. If memory bank is empty, say so honestly.`;
        };

        // API Interaction
        const callGroqApi = async () => {
            setTyping(true);

            try {
                // Build messages with system prompt injected
                const systemMessage = { role: "system", content: buildSystemPrompt() };
                const messagesWithSystem = [systemMessage, ...conversationHistory];

                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: messagesWithSystem
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error?.message || 'Failed to fetch response');
                }

                const data = await response.json();
                const aiMessage = data.choices[0].message.content;

                // Add to conversation history (without system prompt)
                conversationHistory.push({ role: "assistant", content: aiMessage });

                // Parse Memory — expects MEMORY_UPDATE:{"type":"...","label":"...","detail":"..."}
                const memoryMatch = aiMessage.match(/MEMORY_UPDATE:\s*(\{[^}]+\})/s);
                if (memoryMatch && memoryMatch[1]) {
                    try {
                        const memoryData = JSON.parse(memoryMatch[1]);
                        if (memoryData.type && memoryData.label && memoryData.detail) {
                            updateMemories(memoryData);
                        }
                    } catch (e) {
                        console.error("Failed to parse memory json", e);
                    }
                }

                // UI Updates
                setTyping(false);
                const cleanReply = aiMessage
                    .replace(/MEMORY_UPDATE:\s*\{[^}]*\}/gs, '')
                    .trim();
                const { speakBtnRef: newSpeakBtn } = addMessage(cleanReply, 'ai');
                saveChatToDB('assistant', cleanReply);
                speakText(cleanReply, newSpeakBtn);

            } catch (error) {
                console.error(error);
                setTyping(false);
                addMessage(`Error: ${error.message}.`, 'ai');
            }
        };

        const handleSend = () => {
            const text = textInput.value.trim();
            if (!text) return;

            // Add user message
            const { msgId: userMsgId } = addMessage(text, 'user');
            conversationHistory.push({ role: "user", content: text });
            saveChatToDB('user', text);
            textInput.value = '';

            // Track session — set title from first user message
            const sessions = getSessions();
            if (!sessions.find(s => s.id === currentSessionId)) {
                addSession(currentSessionId, text.length > 30 ? text.substring(0, 30) + '...' : text);
            } else {
                updateSessionTitle(currentSessionId, text);
            }
            renderSessionsSidebar();

            // System Commands
            const lowerText = text.toLowerCase();
            const msg = lowerText;

            function extractQueryAnywhere(msg, triggerWords, stopWords) {
                let query = msg;
                
                // Find which trigger word exists and extract after it
                for (let trigger of triggerWords) {
                    if (msg.includes(trigger)) {
                        query = msg.substring(msg.indexOf(trigger) + trigger.length).trim();
                        break;
                    }
                }
                
                // Remove stop words from end
                for (let stop of stopWords) {
                    query = query.replace(new RegExp(stop + '.*$', 'i'), '').trim();
                }
                
                return query.trim();
            }

            if (lowerText.includes('open file manager')) {
                fetch('http://localhost:8765/command?action=filemanager');
                const reply = 'Opening File Manager for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('open browser')) {
                window.open('https://google.com', '_blank');
                const reply = 'Opening Browser for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('open terminal')) {
                fetch('http://localhost:8765/command?action=terminal');
                const reply = 'Opening terminal for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }

            // YOUTUBE
            if (msg.includes('youtube')) {
                let query = '';
                if (msg.includes('search') || msg.includes('type') || msg.includes('play') || msg.includes('find') || msg.includes('chalao')) {
                    query = extractQueryAnywhere(msg, ['search','type','play','find','chalao'], ['on youtube','youtube pe','youtube par','youtube']);
                }
                if (query) {
                    window.open('https://youtube.com/results?search_query=' + encodeURIComponent(query), '_blank');
                    const reply = 'Searching "' + query + '" on YouTube!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                } else {
                    window.open('https://youtube.com', '_blank');
                    const reply = 'Opening YouTube for you!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                }
                return;
            }

            // GOOGLE
            if (msg.includes('google')) {
                let query = '';
                if (msg.includes('search') || msg.includes('find') || msg.includes('dhundo') || msg.includes('type')) {
                    query = extractQueryAnywhere(msg, ['search','find','dhundo','type'], ['on google','google pe','google par','google']);
                }
                if (query) {
                    window.open('https://google.com/search?q=' + encodeURIComponent(query), '_blank');
                    const reply = 'Searching "' + query + '" on Google!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                } else {
                    window.open('https://google.com', '_blank');
                    const reply = 'Opening Google for you!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                }
                return;
            }

            // SPOTIFY
            if (msg.includes('spotify')) {
                let query = extractQueryAnywhere(msg, ['play','search','find'], ['on spotify','spotify pe','spotify']);
                if (query && query !== msg) {
                    window.open('https://open.spotify.com/search/' + encodeURIComponent(query), '_blank');
                    const reply = 'Playing "' + query + '" on Spotify!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                } else {
                    window.open('https://open.spotify.com', '_blank');
                    const reply = 'Opening Spotify for you!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                }
                return;
            }

            // TWITTER/X
            if (msg.includes('twitter') || msg.includes(' x ')) {
                let query = extractQueryAnywhere(msg, ['search','find'], ['on twitter','on x','twitter pe']);
                if (query && query !== msg) {
                    window.open('https://x.com/search?q=' + encodeURIComponent(query), '_blank');
                    const reply = 'Searching "' + query + '" on Twitter!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                } else {
                    window.open('https://x.com', '_blank');
                    const reply = 'Opening Twitter for you!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                }
                return;
            }

            // LINKEDIN
            if (msg.includes('linkedin')) {
                let query = extractQueryAnywhere(msg, ['search','find'], ['on linkedin','linkedin pe']);
                if (query && query !== msg) {
                    window.open('https://linkedin.com/search/results/all/?keywords=' + encodeURIComponent(query), '_blank');
                    const reply = 'Searching "' + query + '" on LinkedIn!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                } else {
                    window.open('https://linkedin.com', '_blank');
                    const reply = 'Opening LinkedIn for you!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                }
                return;
            }

            // GITHUB
            if (msg.includes('github')) {
                let query = extractQueryAnywhere(msg, ['search','find'], ['on github','github pe']);
                if (query && query !== msg) {
                    window.open('https://github.com/search?q=' + encodeURIComponent(query), '_blank');
                    const reply = 'Searching "' + query + '" on GitHub!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                } else {
                    window.open('https://github.com', '_blank');
                    const reply = 'Opening GitHub for you!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                }
                return;
            }

            // GOOGLE MAPS
            if (msg.includes('maps') || msg.includes('directions to') || msg.includes('navigate to')) {
                let place = extractQueryAnywhere(msg, ['directions to','navigate to','search','find'], ['on maps','maps pe']);
                if (place && place !== msg) {
                    window.open('https://maps.google.com/maps?q=' + encodeURIComponent(place), '_blank');
                    const reply = 'Getting directions to "' + place + '"!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                } else {
                    window.open('https://maps.google.com', '_blank');
                    const reply = 'Opening Google Maps for you!';
                    const { speakBtnRef: btn } = addMessage(reply, 'ai');
                    speakText(reply, btn);
                }
                return;
            }

            if (lowerText.includes('play music')) {
                window.open('https://spotify.com', '_blank');
                const reply = 'Playing music on Spotify for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }

            if (lowerText.includes('open settings')) {
                fetch('http://localhost:8765/command?action=settings');
                const reply = 'Opening Settings for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('open vs code') || lowerText.includes('open vscode')) {
                fetch('http://localhost:8765/command?action=vscode');
                const reply = 'Opening VS Code for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('open firefox')) {
                fetch('http://localhost:8765/command?action=firefox');
                const reply = 'Opening Firefox for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('open app center') || lowerText.includes('open apps')) {
                fetch('http://localhost:8765/command?action=appcenter');
                const reply = 'Opening App Center for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }
            if (lowerText.includes('open antigravity')) {
                fetch('http://localhost:8765/command?action=antigravity');
                const reply = 'Opening Antigravity for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }

            let match = lowerText.match(/whatsapp (.+) ko message karo (.*)/);
            if (match) {
                window.open('https://web.whatsapp.com', '_blank');
                const reply = `Opening WhatsApp to message ${match[1]}!`;
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            } else if (lowerText.includes('open whatsapp')) {
                window.open('https://web.whatsapp.com', '_blank');
                const reply = 'Opening WhatsApp for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }

            match = lowerText.match(/instagram pe (.+) dhundo/);
            if (match) {
                window.open('https://instagram.com/' + encodeURIComponent(match[1].trim()), '_blank');
                const reply = `Searching ${match[1]} on Instagram!`;
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            } else if (lowerText.includes('open instagram')) {
                window.open('https://instagram.com', '_blank');
                const reply = 'Opening Instagram for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }

            if (lowerText.includes('open facebook')) {
                window.open('https://facebook.com', '_blank');
                const reply = 'Opening Facebook for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }

            if (lowerText.includes('open gmail')) {
                window.open('https://gmail.com', '_blank');
                const reply = 'Opening Gmail for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }

            if (lowerText.includes('open netflix')) {
                window.open('https://netflix.com', '_blank');
                const reply = 'Opening Netflix for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }

            if (lowerText.includes('open chatgpt')) {
                window.open('https://chat.openai.com', '_blank');
                const reply = 'Opening ChatGPT for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }

            if (lowerText.includes('open news') || lowerText.includes('latest news')) {
                window.open('https://news.google.com', '_blank');
                const reply = 'Opening News for you!';
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }

            match = lowerText.match(/weather in (.+)/);
            if (match) {
                window.open('https://wttr.in/' + encodeURIComponent(match[1].trim()), '_blank');
                const reply = `Checking weather in ${match[1]}!`;
                const { speakBtnRef: btn } = addMessage(reply, 'ai');
                speakText(reply, btn);
                return;
            }


            callGroqApi();
        };

        sendBtn.addEventListener('click', handleSend);
        textInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        // Load persistent data from Supabase on page load
        (async () => {
            try {
                await loadMemoriesFromDB();

                // Ensure current session exists in localStorage
                const sessions = getSessions();
                if (!sessions.find(s => s.id === currentSessionId)) {
                    addSession(currentSessionId, 'New Chat');
                }

                await loadChatFromDB(currentSessionId);
                renderSessionsSidebar();
                console.log('Loaded', memories.length, 'memories and', conversationHistory.length, 'chat messages from DB');
            } catch (e) {
                console.error('Failed to load from Supabase:', e);
            }
        })();
    </script>
</body>

</html>
